<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Simple Banking</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        /* Animated Gradient Background */
        background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #121212);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        overflow: hidden;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        width: 350px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      input {
        width: 85%;
        padding: 12px;
        margin-bottom: 25px;
        border-radius: 12px;
        border: 2px solid transparent;
        background: rgba(255, 255, 255, 0.9);
        font-size: 18px;
        outline: none;
        transition: 0.3s;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      input:focus {
        border-color: #00ffcc;
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 3D Button Style */
      button {
        position: relative;
        padding: 15px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        color: white;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.1s;
        /* Bottom shadow for 3D depth */
      }

      /* Deposit 3D */
      .deposit {
        background: #00b09b;
        box-shadow: 0 6px 0 #007a6c;
      }
      .deposit:active {
        box-shadow: 0 2px 0 #007a6c;
        transform: translateY(4px);
      }

      /* Withdraw 3D */
      .withdraw {
        background: #ff5f6d;
        box-shadow: 0 6px 0 #b8434d;
      }
      .withdraw:active {
        box-shadow: 0 2px 0 #b8434d;
        transform: translateY(4px);
      }

      /* Balance 3D */
      .balance {
        background: #f7971e;
        box-shadow: 0 6px 0 #ae6914;
      }
      .balance:active {
        box-shadow: 0 2px 0 #ae6914;
        transform: translateY(4px);
      }

      #output {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 25px;
        min-height: 35px;
        color: #00ffcc;
        text-shadow: 0 2px 10px rgba(0, 255, 204, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🏦 Smart Bank</h2>

      <div id="output">Welcome!</div>

      <input type="number" id="amount" placeholder="Enter Amount" />

      <div class="btn-group">
        <button class="deposit" onclick="doDeposit()">Deposit Money</button>
        <button class="withdraw" onclick="doWithdraw()">Withdraw Money</button>
        <button class="balance" onclick="doCheck()">Check Balance</button>
      </div>
    </div>

    <script>
      let currentBalance = 1000;

      const outputDiv = document.getElementById("output");
      const amountInput = document.getElementById("amount");

      function doDeposit() {
        const amt = Number(amountInput.value);
        if (amt > 0) {
          currentBalance += amt;
          outputDiv.innerText = `Deposited: ₹${amt}`;
        } else {
          outputDiv.innerText = "Invalid Amount!";
        }
        amountInput.value = "";
      }

      function doWithdraw() {
        const amt = Number(amountInput.value);
        if (amt > currentBalance) {
          outputDiv.innerText = "Insufficient Funds!";
        } else if (amt > 0) {
          currentBalance -= amt;
          outputDiv.innerText = `Withdrawn: ₹${amt}`;
        } else {
          outputDiv.innerText = "Invalid Amount!";
        }
        amountInput.value = "";
      }

      function doCheck() {
        outputDiv.innerText = `Balance: ₹${currentBalance}`;
      }
    </script>
  </body>
</html>
